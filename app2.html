/**
 * Global Utilities: Security (XSS prevention) & Timezone-Safe Dates
 */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
window.escapeHtml = escapeHtml;

function parseLocalDate(dateStr) {
  if (!dateStr) return new Date();
  if (typeof dateStr === 'string') {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }
  }
  return new Date(dateStr);
}
window.parseLocalDate = parseLocalDate;

function formatLocalDate(date) {
  if (!date) return '';
  const d = (date instanceof Date) ? date : new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
window.formatLocalDate = formatLocalDate;

class Store {
  constructor() {
    this.subscribers = [];
    this.state = this.loadState();
  }

  getUserName() {
    return (this.state && this.state.settings && this.state.settings.userName && this.state.settings.userName.trim()) || '';
  }

  getGreeting(prefix = null) {
    const name = this.getUserName();
    const hour = new Date().getHours();
    let timeOfDay = 'Buenos días';
    if (hour >= 12 && hour < 19) {
      timeOfDay = 'Buenas tardes';
    } else if (hour >= 19 || hour < 6) {
      timeOfDay = 'Buenas noches';
    }

    if (prefix) {
      return name ? `${prefix}, ${name}` : prefix;
    }
    return name ? `${timeOfDay}, ${name}` : timeOfDay;
  }

  loadState() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        const base = JSON.parse(JSON.stringify(INITIAL_STATE));
        return {
          ...base,
          ...parsed,
          marcas: Array.isArray(parsed.marcas) ? parsed.marcas : base.marcas,
          proyectos: Array.isArray(parsed.proyectos) ? parsed.proyectos : base.proyectos,
          contenidos: Array.isArray(parsed.contenidos) ? parsed.contenidos : base.contenidos,
          tareas: Array.isArray(parsed.tareas) ? parsed.tareas : base.tareas,
          eventosCalendario: Array.isArray(parsed.eventosCalendario) ? parsed.eventosCalendario : base.eventosCalendario,
          ideas: Array.isArray(parsed.ideas) ? parsed.ideas : base.ideas,
          recordatorios: Array.isArray(parsed.recordatorios) ? parsed.recordatorios : base.recordatorios,
          settings: {
            ...base.settings,
            ...(parsed.settings || {})
          }
        };
      }
    } catch (e) {
      console.warn('ComunicaLab: Error loading state from localStorage, initializing fresh:', e);
    }
    return JSON.parse(JSON.stringify(INITIAL_STATE));
  }

  saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (e) {
      console.error('ComunicaLab: Failed to save state to localStorage:', e);
      if (typeof window !== 'undefined' && window.Toast) {
        window.Toast.show('Atención: almacenamiento local lleno o no disponible', 'error');
      }
    }
    this.notify();
  }

  subscribe(fn) {
    this.subscribers.push(fn);
    return () => {
      this.subscribers = this.subscribers.filter(sub => sub !== fn);
    };
  }

  notify() {
    this.subscribers.forEach(fn => fn(this.state));
  }

  getState() {
    return this.state;
  }

  resetToDemo() {
    this.state = JSON.parse(JSON.stringify(INITIAL_STATE));
    this.saveState();
  }

  exportJson() {
    return JSON.stringify(this.state, null, 2);
  }

  importJson(jsonString) {
    try {
      const parsed = JSON.parse(jsonString);
      if (!parsed || typeof parsed !== 'object') {
        return { success: false, error: 'El archivo JSON no tiene un formato válido.' };
      }
      if (!Array.isArray(parsed.marcas)) {
        return { success: false, error: 'Estructura de respaldo no válida: falta la lista de marcas.' };
      }

      // Pre-import automatic safety backup
      try {
        localStorage.setItem('comunicalab_backup_pre_import', JSON.stringify(this.state));
      } catch (err) {
        console.warn('ComunicaLab: No se pudo guardar la copia de seguridad previa a la importación:', err);
      }

      const base = JSON.parse(JSON.stringify(INITIAL_STATE));
      this.state = {
        ...base,
        ...parsed,
        marcas: Array.isArray(parsed.marcas) ? parsed.marcas : [],
        proyectos: Array.isArray(parsed.proyectos) ? parsed.proyectos : [],
        contenidos: Array.isArray(parsed.contenidos) ? parsed.contenidos : [],
        tareas: Array.isArray(parsed.tareas) ? parsed.tareas : [],
        eventosCalendario: Array.isArray(parsed.eventosCalendario) ? parsed.eventosCalendario : [],
        ideas: Array.isArray(parsed.ideas) ? parsed.ideas : [],
        recordatorios: Array.isArray(parsed.recordatorios) ? parsed.recordatorios : [],
        settings: {
          ...base.settings,
          ...(parsed.settings || {})
        }
      };

      if (this.state.marcas.length > 0 && !this.state.marcas.some(m => m.id === this.state.activeBrandId)) {
        this.state.activeBrandId = this.state.marcas[0].id;
      }
      if (this.state.proyectos.length > 0 && !this.state.proyectos.some(p => p.id === this.state.activeProjectId)) {
        this.state.activeProjectId = this.state.proyectos[0].id;
      }

      this.saveState();
      return { success: true };
    } catch (e) {
      return { success: false, error: 'Error al interpretar el archivo JSON: ' + e.message };
    }
  }

  restorePreImportBackup() {
    try {
      const backup = localStorage.getItem('comunicalab_backup_pre_import');
      if (!backup) {
        return { success: false, error: 'No existe una copia de seguridad previa.' };
      }
      const parsed = JSON.parse(backup);
      this.state = parsed;
      this.saveState();
      return { success: true };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  // --- Navigation & Routing ---
  setRoute(route, params = {}) {
    this.state.currentRoute = route;
    if (params.brandId) this.state.activeBrandId = params.brandId;
    if (params.projectId) this.state.activeProjectId = params.projectId;
    if (params.contentId) this.state.activeContentId = params.contentId;
    if (params.brandTab) this.state.brandTab = params.brandTab;
    this.saveState();
  }

  setActiveBrand(brandId) {
    this.state.activeBrandId = brandId;
    // Auto-select first project of that brand if current active project doesn't belong
    const project = this.state.proyectos.find(p => p.id === this.state.activeProjectId && p.brandId === brandId);
    if (!project) {
      const brandProjects = this.getBrandProjects(brandId);
      if (brandProjects.length > 0) {
        this.state.activeProjectId = brandProjects[0].id;
      }
    }
    this.saveState();
  }

  setActiveProject(projectId) {
    this.state.activeProjectId = projectId;
    const project = this.state.proyectos.find(p => p.id === projectId);
    if (project) {
      this.state.activeBrandId = project.brandId;
    }
    this.saveState();
  }

  setActiveContent(contentId) {
    this.state.activeContentId = contentId;
    const content = this.state.contenidos.find(c => c.id === contentId);
    if (content) {
      this.state.activeBrandId = content.brandId;
      this.state.activeProjectId = content.projectId;
    }
    this.saveState();
  }

  setBrandTab(tab) {
    this.state.brandTab = tab;
    this.saveState();
  }

  setCalendarView(view) {
    this.state.calendarView = view;
    this.saveState();
  }

  setCalendarFilter(filter) {
    this.state.calendarFilter = filter;
    this.saveState();
  }

  setCalendarSelectedDate(date) {
    this.state.calendarSelectedDate = date;
    const parts = date.split('-');
    if (parts.length === 3) {
      this.state.calendarSelectedYear = parseInt(parts[0], 10);
      this.state.calendarSelectedMonth = parseInt(parts[1], 10) - 1;
    }
    this.saveState();
  }

  changeCalendarMonth(delta) {
    let m = (this.state.calendarSelectedMonth ?? 9) + delta;
    let y = this.state.calendarSelectedYear ?? 2026;
    if (m < 0) {
      m = 11;
      y -= 1;
    } else if (m > 11) {
      m = 0;
      y += 1;
    }
    this.state.calendarSelectedMonth = m;
    this.state.calendarSelectedYear = y;
    const d = `${y}-${String(m + 1).padStart(2, '0')}-01`;
    this.state.calendarSelectedDate = d;
    this.saveState();
  }

  goCalendarToday() {
    const today = new Date();
    this.state.calendarSelectedYear = today.getFullYear();
    this.state.calendarSelectedMonth = today.getMonth();
    this.state.calendarSelectedDate = formatLocalDate(today);
    this.saveState();
  }

  setTaskFilter(filter) {
    this.state.taskFilter = filter;
    this.saveState();
  }

  setIdeaFilter(filter) {
    this.state.ideaFilter = filter;
    this.saveState();
  }

  // --- Getters with context ---
  getActiveBrand() {
    return this.state.marcas.find(m => m.id === this.state.activeBrandId) || this.state.marcas[0] || null;
  }

  getActiveProject() {
    return this.state.proyectos.find(p => p.id === this.state.activeProjectId) || this.state.proyectos[0] || null;
  }

  getActiveContent() {
    return this.state.contenidos.find(c => c.id === this.state.activeContentId) || this.state.contenidos[0] || null;
  }

  getBrandProjects(brandId = this.state.activeBrandId) {
    return this.state.proyectos.filter(p => p.brandId === brandId);
  }

  getBrandContents(brandId = this.state.activeBrandId) {
    return this.state.contenidos.filter(c => c.brandId === brandId);
  }

  getProjectContents(projectId = this.state.activeProjectId) {
    return this.state.contenidos.filter(c => c.projectId === projectId);
  }

  getProjectTasks(projectId = this.state.activeProjectId) {
    return this.state.tareas.filter(t => t.projectId === projectId);
  }

  getBrandTasks(brandId = this.state.activeBrandId) {
    return this.state.tareas.filter(t => t.brandId === brandId);
  }

  // --- Brand Actions ---
  createBrand(data) {
    const name = (data.name || '').trim();
    if (!name) return null;
    const id = 'brand-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const newBrand = {
      id,
      name,
      slug: name.toLowerCase().replace(/[^a-z0-9]/g, '-'),
      tagline: data.tagline ? data.tagline.trim() : 'Nueva marca en ComunicaLab',
      category: data.category ? data.category.trim() : 'General',
      color: data.color || '#a93100',
      logo: data.logo || null,
      status: 'Activa',
      strategy: {
        mission: data.mission ? data.mission.trim() : '',
        audience: data.audience ? data.audience.trim() : '',
        tone: data.tone ? data.tone.trim() : 'Profesional y creativo',
        pillars: data.pillars && data.pillars.length > 0 ? data.pillars : ['Contenido General']
      }
    };
    this.state.marcas.push(newBrand);
    this.state.activeBrandId = id;
    this.state.brandTab = 'proyectos';
    this.state.currentRoute = 'marca-detalle';
    this.saveState();
    return newBrand;
  }

  updateBrand(id, updates) {
    const idx = this.state.marcas.findIndex(m => m.id === id);
    if (idx !== -1) {
      const current = this.state.marcas[idx];
      this.state.marcas[idx] = {
        ...current,
        ...updates,
        name: updates.name !== undefined ? updates.name.trim() : current.name,
        strategy: {
          ...current.strategy,
          ...(updates.strategy || {})
        }
      };
      this.saveState();
      return this.state.marcas[idx];
    }
    return null;
  }

  deleteBrand(id) {
    this.state.marcas = this.state.marcas.filter(m => m.id !== id);
    this.state.proyectos = this.state.proyectos.filter(p => p.brandId !== id);
    this.state.contenidos = this.state.contenidos.filter(c => c.brandId !== id);
    this.state.tareas = this.state.tareas.filter(t => t.brandId !== id);
    this.state.eventosCalendario = this.state.eventosCalendario.filter(e => e.brandId !== id);
    this.state.ideas = this.state.ideas.filter(i => i.brandId !== id);

    if (this.state.activeBrandId === id) {
      this.state.activeBrandId = this.state.marcas.length > 0 ? this.state.marcas[0].id : null;
      const bProjects = this.state.marcas.length > 0 ? this.getBrandProjects(this.state.activeBrandId) : [];
      this.state.activeProjectId = bProjects.length > 0 ? bProjects[0].id : null;
    }
    this.saveState();
  }

  // --- Project Actions ---
  createProject(data) {
    const name = (data.name || '').trim();
    if (!name) return null;
    const id = 'proj-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const newProject = {
      id,
      brandId: data.brandId || this.state.activeBrandId,
      code: data.code || 'PROJ-' + Math.floor(100 + Math.random() * 900),
      name,
      description: data.description ? data.description.trim() : (data.objective ? data.objective.trim() : ''),
      concept: data.concept ? data.concept.trim() : name,
      objective: data.objective ? data.objective.trim() : '',
      audience: data.audience ? data.audience.trim() : '',
      tone: data.tone ? data.tone.trim() : '',
      status: data.status || 'Planificación',
      startDate: data.startDate || new Date().toISOString().split('T')[0],
      endDate: data.endDate || new Date(Date.now() + 30 * 86400000).toISOString().split('T')[0],
      pillars: data.pillars || ['Lanzamiento', 'Cultura']
    };
    this.state.proyectos.push(newProject);
    this.state.activeProjectId = id;
    this.state.currentRoute = 'proyecto-detalle';
    this.saveState();
    return newProject;
  }

  updateProject(id, updates) {
    const idx = this.state.proyectos.findIndex(p => p.id === id);
    if (idx !== -1) {
      this.state.proyectos[idx] = { ...this.state.proyectos[idx], ...updates };
      this.saveState();
      return this.state.proyectos[idx];
    }
    return null;
  }

  deleteProject(id) {
    this.state.proyectos = this.state.proyectos.filter(p => p.id !== id);
    this.state.contenidos = this.state.contenidos.filter(c => c.projectId !== id);
    this.state.tareas = this.state.tareas.filter(t => t.projectId !== id);
    this.state.eventosCalendario = this.state.eventosCalendario.filter(e => e.projectId !== id);

    if (this.state.activeProjectId === id) {
      const remaining = this.getBrandProjects(this.state.activeBrandId);
      this.state.activeProjectId = remaining.length > 0 ? remaining[0].id : null;
    }
    this.saveState();
  }

  // --- Content Actions ---
  createContent(data) {
    const title = (data.title || '').trim();
    if (!title) return null;
    const id = 'cont-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const newContent = {
      id,
      brandId: data.brandId || this.state.activeBrandId,
      projectId: data.projectId || this.state.activeProjectId,
      title,
      format: data.format || 'Reel',
      platform: data.platform || 'Instagram',
      status: data.status || 'Idea',
      date: data.date || this.state.calendarSelectedDate,
      time: data.time || '10:00',
      duration: data.duration || '9:16 Vertical',
      objective: data.objective ? data.objective.trim() : (data.idea ? data.idea.trim() : ''),
      audience: data.audience ? data.audience.trim() : '',
      tone: data.tone ? data.tone.trim() : '',
      creative: {
        hook: data.hook ? data.hook.trim() : `¿Por qué ${title} marca un antes y un después?`,
        copy: data.copy ? data.copy.trim() : '',
        hashtags: data.hashtags || ['#ComunicaLab', '#Contenido'],
        scenes: data.scenes || [
          { time: '00-03s', desc: 'Hook visual de alto impacto con corte dinámico.' },
          { time: '03-15s', desc: 'Desarrollo conceptual y contexto de la pieza.' },
          { time: '15-25s', desc: 'Detalle técnico y prueba social.' },
          { time: '25-30s', desc: 'Cierre con llamado a la acción enfocado en comentarios o DM.' }
        ]
      },
      shootChecklist: [
        { label: 'Cámara & Baterías cargadas al 100%', done: false },
        { label: 'Muestras de producto listas y planchadas', done: false },
        { label: 'Iluminación principal y contraluz ajustados', done: false },
        { label: 'Audio inalámbrico verificado sin interferencias', done: false }
      ],
      platformsSync: {
        instagram: true,
        tiktok: data.platform === 'TikTok',
        facebook: false
      },
      material: []
    };

    this.state.contenidos.push(newContent);

    // Auto-create linked calendar event
    this.createCalendarEvent({
      title: `Salida: ${newContent.title}`,
      type: 'publicacion',
      brandId: newContent.brandId,
      projectId: newContent.projectId,
      contentId: newContent.id,
      date: newContent.date,
      time: newContent.time,
      notes: `Publicación en ${newContent.platform} (${newContent.format})`
    });

    this.state.activeContentId = id;
    this.state.currentRoute = 'contenido-detalle';
    this.saveState();
    return newContent;
  }

  updateContent(id, updates) {
    const idx = this.state.contenidos.findIndex(c => c.id === id);
    if (idx !== -1) {
      this.state.contenidos[idx] = { ...this.state.contenidos[idx], ...updates };
      if (updates.date || updates.time || updates.title) {
        const evt = this.state.eventosCalendario.find(e => e.contentId === id);
        if (evt) {
          if (updates.date) evt.date = updates.date;
          if (updates.time) evt.time = updates.time;
          if (updates.title) evt.title = `Salida: ${updates.title}`;
        }
      }
      this.saveState();
      return this.state.contenidos[idx];
    }
    return null;
  }

  updateContentStatus(id, newStatus) {
    return this.updateContent(id, { status: newStatus });
  }

  deleteContent(id) {
    this.state.contenidos = this.state.contenidos.filter(c => c.id !== id);
    this.state.tareas = this.state.tareas.filter(t => t.contentId !== id);
    this.state.eventosCalendario = this.state.eventosCalendario.filter(e => e.contentId !== id);
    if (this.state.activeContentId === id) {
      const remaining = this.getProjectContents(this.state.activeProjectId);
      this.state.activeContentId = remaining.length > 0 ? remaining[0].id : null;
    }
    this.saveState();
  }

  // --- Task Actions ---
  createTask(data) {
    const title = (data.title || '').trim();
    if (!title) return null;
    const id = 'task-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const defaultAssignee = this.getUserName() || 'Equipo';
    const newTask = {
      id,
      brandId: data.brandId || this.state.activeBrandId,
      projectId: data.projectId || this.state.activeProjectId,
      contentId: data.contentId || null,
      title,
      assignee: data.assignee ? data.assignee.trim() : defaultAssignee,
      status: data.status || 'pendiente',
      date: data.date || new Date().toISOString().split('T')[0],
      time: data.time || '10:00',
      notes: data.notes ? data.notes.trim() : ''
    };
    this.state.tareas.unshift(newTask);
    this.saveState();
    return newTask;
  }

  updateTask(id, updates) {
    const idx = this.state.tareas.findIndex(t => t.id === id);
    if (idx !== -1) {
      this.state.tareas[idx] = { ...this.state.tareas[idx], ...updates };
      this.saveState();
      return this.state.tareas[idx];
    }
    return null;
  }

  toggleTaskStatus(id) {
    const task = this.state.tareas.find(t => t.id === id);
    if (task) {
      task.status = task.status === 'completada' ? 'pendiente' : 'completada';
      this.saveState();
      return task;
    }
    return null;
  }

  deleteTask(id) {
    this.state.tareas = this.state.tareas.filter(t => t.id !== id);
    this.saveState();
  }

  // --- Calendar Events ---
  createCalendarEvent(data) {
    const title = (data.title || '').trim();
    if (!title) return null;
    const id = 'evt-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const newEvent = {
      id,
      title,
      type: data.type || 'publicacion',
      brandId: data.brandId || this.state.activeBrandId,
      projectId: data.projectId || this.state.activeProjectId,
      contentId: data.contentId || null,
      date: data.date || this.state.calendarSelectedDate,
      time: data.time || '10:00',
      notes: data.notes ? data.notes.trim() : ''
    };
    this.state.eventosCalendario.push(newEvent);
    this.saveState();
    return newEvent;
  }

  updateCalendarEvent(id, updates) {
    const idx = this.state.eventosCalendario.findIndex(e => e.id === id);
    if (idx !== -1) {
      this.state.eventosCalendario[idx] = { ...this.state.eventosCalendario[idx], ...updates };
      if (this.state.eventosCalendario[idx].contentId && updates.date) {
        const cIdx = this.state.contenidos.findIndex(c => c.id === this.state.eventosCalendario[idx].contentId);
        if (cIdx !== -1) {
          this.state.contenidos[cIdx].date = updates.date;
          if (updates.time) this.state.contenidos[cIdx].time = updates.time;
        }
      }
      this.saveState();
      return this.state.eventosCalendario[idx];
    }
    return null;
  }

  deleteCalendarEvent(id) {
    this.state.eventosCalendario = this.state.eventosCalendario.filter(e => e.id !== id);
    this.saveState();
  }

  // --- Ideas Laboratorio ---
  createIdea(data) {
    const title = (data.title || '').trim();
    if (!title) return null;
    const id = 'idea-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
    const newIdea = {
      id,
      title,
      type: data.type || 'idea',
      brandId: data.brandId || this.state.activeBrandId,
      tags: data.tags && data.tags.length > 0 ? data.tags : ['General'],
      notes: data.notes ? data.notes.trim() : '',
      date: formatLocalDate(new Date())
    };
    this.state.ideas.unshift(newIdea);
    this.saveState();
    return newIdea;
  }

  updateIdea(id, updates) {
    const idx = this.state.ideas.findIndex(i => i.id === id);
    if (idx !== -1) {
      this.state.ideas[idx] = { ...this.state.ideas[idx], ...updates };
      this.saveState();
      return this.state.ideas[idx];
    }
    return null;
  }

  deleteIdea(id) {
    this.state.ideas = this.state.ideas.filter(i => i.id !== id);
    this.saveState();
  }

  convertIdeaToProject(ideaId) {
    const idea = this.state.ideas.find(i => i.id === ideaId);
    if (!idea) return null;
    const project = this.createProject({
      name: idea.title,
      brandId: idea.brandId,
      description: idea.notes,
      concept: idea.title,
      pillars: idea.tags
    });
    this.deleteIdea(ideaId);
    return project;
  }

  convertIdeaToContent(ideaId) {
    const idea = this.state.ideas.find(i => i.id === ideaId);
    if (!idea) return null;
    let format = 'Reel';
    if (idea.tags.some(t => t.toLowerCase().includes('carrusel'))) format = 'Carrusel';
    if (idea.tags.some(t => t.toLowerCase().includes('tiktok'))) format = 'TikTok';
    if (idea.tags.some(t => t.toLowerCase().includes('historia') || t.toLowerCase().includes('story'))) format = 'Story';

    // Ensure projectId belongs to the idea's brand
    let targetProjectId = this.state.activeProjectId;
    const currentProject = this.state.proyectos.find(p => p.id === targetProjectId);
    if (!currentProject || currentProject.brandId !== idea.brandId) {
      const brandProjects = this.getBrandProjects(idea.brandId);
      if (brandProjects.length > 0) {
        targetProjectId = brandProjects[0].id;
      } else {
        const defaultProj = this.createProject({
          name: `General ${idea.title}`,
          brandId: idea.brandId,
          description: 'Proyecto generado automáticamente para contenidos'
        });
        targetProjectId = defaultProj.id;
      }
    }

    const content = this.createContent({
      title: idea.title,
      brandId: idea.brandId,
      projectId: targetProjectId,
      format,
      idea: idea.notes,
      platform: format === 'TikTok' ? 'TikTok' : 'Instagram'
    });
    this.deleteIdea(ideaId);
    return content;
  }

  // --- Reminders ---
  createReminder(data) {
    const title = (data.title || '').trim();
    if (!title) return null;
    const id = 'rem-' + Date.now().toString(36);
    const newRem = {
      id,
      title,
      timeText: data.timeText ? data.timeText.trim() : 'Próximamente',
      type: data.type || 'deadline',
      brandId: data.brandId || this.state.activeBrandId,
      contentId: data.contentId || null,
      dueDate: data.dueDate || new Date().toISOString()
    };
    this.state.recordatorios.unshift(newRem);
    this.saveState();
    return newRem;
  }

  deleteReminder(id) {
    this.state.recordatorios = this.state.recordatorios.filter(r => r.id !== id);
    this.saveState();
  }
}

  // --- Project Audit Engine ---
  auditProject(project, contents = [], tasks = []) {
    const totalTasks = tasks.length;
    const completedTasks = tasks.filter(t => t.status === 'completada').length;
    const pendingTasks = tasks.filter(t => t.status !== 'completada');
    const taskProgress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

    const publishedContents = contents.filter(c => c.status === 'Publicado' || c.status === 'Programado');
    const productionContents = contents.filter(c => c.status === 'Grabación' || c.status === 'Edición');

    const missingItems = [];

    if (contents.length === 0) {
      missingItems.push('No hay piezas de contenido creadas en este proyecto.');
    } else if (publishedContents.length < contents.length / 2) {
      missingItems.push(`Solo hay ${publishedContents.length} de ${contents.length} piezas programadas o publicadas.`);
    }

    if (productionContents.length > 0) {
      missingItems.push(`Hay ${productionContents.length} pieza(s) en rodaje o edición. Revisa el color grading y la sincronización sonora.`);
    }

    if (pendingTasks.some(t => t.title.toLowerCase().includes('copy'))) {
      missingItems.push('Falta finalizar los copies oficiales y adaptar los llamados a la acción por canal.');
    }

    if (pendingTasks.some(t => t.title.toLowerCase().includes('programar') || t.title.toLowerCase().includes('deploy'))) {
      missingItems.push('Falta programar el auto-deploy y configurar los recordatorios de publicación.');
    }

    if (missingItems.length === 0) {
      missingItems.push('¡Excelente! Todas las tareas operativas están al día. Solo resta monitorear las métricas de salida y responder a la comunidad.');
    }

    return {
      projectName: project ? project.name : 'Proyecto',
      progressPercent: taskProgress,
      pendingTasksCount: pendingTasks.length,
      contentsReadyCount: publishedContents.length,

      `• **Variaciones de copy:** Escribe *"copy"* para ver opciones editoriales y de conversión.\\n` +
      `• **Auditoría de proyecto:** Escribe *"¿qué me falta?"* para diagnosticar entregables.\\n` +
      `• **Pilares de contenido:** Escribe *"pilares"* para diseñar la matriz semanal.\\n\\n` +
      `*(Para conectar un modelo de IA en la nube como Gemini o Claude, puedes configurar tu endpoint de backend en Configuración > Inteligencia Artificial).*\\n\\n` +
      `¿En cuál de estos desafíos nos enfocamos ahora?`;
  },

  // --- Async Assistant Dispatcher (Supports External API with Local Fallback) ---
  async askAssistantAsync(query, context = {}) {
    const settings = window.comunicaStore.getState().settings || {};
    const aiConfig = settings.ai || {};

    if (aiConfig.provider === 'custom_api' && aiConfig.apiEndpoint) {
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (aiConfig.apiKey) {
          headers['Authorization'] = `Bearer ${aiConfig.apiKey}`;
        }
        const res = await fetch(aiConfig.apiEndpoint, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            prompt: query,
            context: {
              brandName: context.brand ? context.brand.name : '',
              projectName: context.project ? context.project.name : '',
              model: aiConfig.model || 'gemini-1.5-flash'
            }
          })
        });

        if (res.ok) {
          const data = await res.json();
          const reply = data.reply || data.text || data.message || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content);
          if (reply) {
            return reply + '\\n\\n*(Generado vía API de IA Conectada)*';
          }
        }
        console.warn('ComunicaLab: Endpoint de IA devolvió status no exitoso, usando asistente local.');
      } catch (err) {
        console.warn('ComunicaLab: Error conectando con API de IA externa:', err);
      }
    }

    // Fallback to local assistant
    return this.askAssistant(query, context);
  }
};

window.ComunicaAI = ComunicaAI;

/**
 * ComunicaLab - Toast Notification System
 */

const Toast = {
  show(message, type = 'default') {
    const existing = document.getElementById('comunica-toast');
    if (existing) {
      existing.remove();
    }

    const toast = document.createElement('div');
    toast.id = 'comunica-toast';
    toast.className = 'fixed bottom-20 sm:bottom-6 right-4 sm:right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl font-title-sm text-[13px] font-medium text-white transition-all transform translate-y-2 opacity-0 animate-slide-up';

    let icon = 'info';
    let bgColor = 'bg-on-surface';

    if (type === 'ai') {
      bgColor = 'bg-secondary';
      icon = 'auto_awesome';
    } else if (type === 'success') {
      bgColor = 'bg-tertiary';
      icon = 'check_circle';
    } else if (type === 'error') {
      bgColor = 'bg-error';
      icon = 'warning';
    }

    toast.classList.add(bgColor);
    toast.innerHTML = `
      <span class="material-symbols-outlined text-[18px]">${icon}</span>
      <span>${escapeHtml(message)}</span>
    `;

    document.body.appendChild(toast);

    const raf = typeof requestAnimationFrame !== 'undefined' ? requestAnimationFrame : (cb) => setTimeout(cb, 16);
    raf(() => {
      toast.classList.remove('translate-y-2', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
    });

    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => toast.remove(), 250);
    }, 3200);
  }
};

window.Toast = Toast;

/**
 * ComunicaLab - Calendar View (Editorial & Producción)
 * Fully dynamic month, week and agenda calculations with timezone-safe dates
 */

const CalendarView = {
  render(state) {
    const calendarView = state.calendarView || 'mes';
    const currentFilter = state.calendarFilter || 'all';
    const selectedDate = state.calendarSelectedDate || formatLocalDate(new Date());

    const events = state.eventosCalendario || [];
    const filteredEvents = events.filter(evt => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'publicacion') return evt.type === 'publicacion';
      if (currentFilter === 'produccion') return evt.type === 'produccion';
      if (currentFilter === 'agenda') return evt.type === 'agenda' || evt.type === 'revision';
      return true;
    });

    const dayEvents = filteredEvents.filter(e => e.date === selectedDate);

    // Current displayed Year & Month
    let year = state.calendarSelectedYear;
    let month = state.calendarSelectedMonth;

    if (year === undefined || month === undefined) {
      const parsedSel = parseLocalDate(selectedDate);
      year = parsedSel.getFullYear();
      month = parsedSel.getMonth();
    }

    const monthNames = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];
    const currentMonthLabel = monthNames[month] || 'Mes';

    // Build dynamic calendar matrix for this year and month
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();

    // Monday as index 0 (0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun)
    let startDayOfWeek = firstDay.getDay() - 1;
    if (startDayOfWeek === -1) startDayOfWeek = 6;

    const monthMatrix = [];

    // Prev month padding
    const prevMonthLastDay = new Date(year, month, 0).getDate();
    for (let i = startDayOfWeek - 1; i >= 0; i--) {
      const d = prevMonthLastDay - i;
      const prevDate = new Date(year, month - 1, d);
      monthMatrix.push({
        day: d,
        date: formatLocalDate(prevDate),
        currentMonth: false
      });
    }

    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      const curDate = new Date(year, month, d);
      monthMatrix.push({
        day: d,
        date: formatLocalDate(curDate),
        currentMonth: true
      });
    }

    // Next month padding to complete rows of 7
    let nextMonthDay = 1;
    while (monthMatrix.length % 7 !== 0) {
      const nextDate = new Date(year, month + 1, nextMonthDay);
      monthMatrix.push({
        day: nextMonthDay,
        date: formatLocalDate(nextDate),
        currentMonth: false
      });
      nextMonthDay++;
    }

    // Dynamic Week View calculation (Monday to Sunday containing selectedDate)
    const selDateObj = parseLocalDate(selectedDate);
    let selDayOfWeek = selDateObj.getDay() - 1;
    if (selDayOfWeek === -1) selDayOfWeek = 6;
    const mondayObj = new Date(selDateObj);
    mondayObj.setDate(selDateObj.getDate() - selDayOfWeek);

    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      const dayDate = new Date(mondayObj);
      dayDate.setDate(mondayObj.getDate() + i);
      weekDays.push(formatLocalDate(dayDate));
    }

    // Dynamic Agenda View calculation: sort all filtered events by date
    const sortedAgendaEvents = [...filteredEvents].sort((a, b) => {
      const dComp = (a.date || '').localeCompare(b.date || '');
      if (dComp !== 0) return dComp;
      return (a.time || '').localeCompare(b.time || '');
    });

    return `
      <div class="flex flex-col w-full max-w-5xl mx-auto pb-28 pt-2 px-4 sm:px-6">
        
        <!-- Header Controls & Month Navigator -->
        <div class="pt-2 flex flex-col gap-3">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-baseline gap-2">
              <h1 class="font-headline-md sm:font-headline-lg text-headline-md sm:text-headline-lg text-on-surface tracking-tight font-normal">
                ${currentMonthLabel}
              </h1>
              <span class="font-label-code text-[14px] text-on-surface-variant font-semibold">${year}</span>
              <span class="font-label-meta text-[11px] text-primary uppercase font-bold bg-primary-fixed/40 px-2 py-0.5 rounded-full ml-1">
                Editorial & Rodaje
              </span>
            </div>
            
            <div class="flex items-center gap-2">
              <!-- Month navigation buttons -->
              <div class="flex items-center bg-surface-container rounded-xl p-0.5 border border-surface-container-highest">
                <button 
                  class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-surface-container-high transition-colors"
                  onclick="window.comunicaApp.changeCalendarMonth(-1)"
                  title="Mes anterior"
                >
                  <span class="material-symbols-outlined text-[18px]">chevron_left</span>
                </button>
                <button 
                  class="px-2.5 h-8 font-label-code text-[11px] font-semibold hover:bg-surface-container-high rounded-lg transition-colors"
                  onclick="window.comunicaApp.goCalendarToday()"
                  title="Ir al mes actual"
                >
                  Hoy
                </button>
                <button 
                  class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-surface-container-high transition-colors"
                  onclick="window.comunicaApp.changeCalendarMonth(1)"
                  title="Mes siguiente"
                >
                  <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                </button>
              </div>

              <button 
                class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-primary text-on-primary font-title-sm text-[13px] font-semibold shadow-xs hover:bg-primary-container active:scale-95 transition-all"
                onclick="window.comunicaApp.openModal('modal-agendar-evento')"
              >
                <span class="material-symbols-outlined text-[17px]">add</span>
                <span>Agendar</span>
              </button>
            </div>
          </div>

          <!-- Segmented View Switcher: Mes / Semana / Agenda -->
          <div class="flex p-1 rounded-full bg-surface-container-high/80 text-on-surface-variant max-w-sm">
            <button 
              class="flex-1 py-1.5 text-center rounded-full font-title-sm text-[12px] font-semibold transition-all ${calendarView === 'mes' ? 'bg-surface-container-lowest text-on-surface shadow-xs' : 'text-on-surface-variant hover:text-on-surface'}"
              onclick="window.comunicaStore.setCalendarView('mes')"
            >
              Mes
            </button>
            <button 
              class="flex-1 py-1.5 text-center rounded-full font-title-sm text-[12px] font-semibold transition-all ${calendarView === 'semana' ? 'bg-surface-container-lowest text-on-surface shadow-xs' : 'text-on-surface-variant hover:text-on-surface'}"
              onclick="window.comunicaStore.setCalendarView('semana')"
            >
              Semana
            </button>
            <button 
              class="flex-1 py-1.5 text-center rounded-full font-title-sm text-[12px] font-semibold transition-all ${calendarView === 'agenda' ? 'bg-surface-container-lowest text-on-surface shadow-xs' : 'text-on-surface-variant hover:text-on-surface'}"
              onclick="window.comunicaStore.setCalendarView('agenda')"
            >
              Agenda
            </button>
          </div>

          <!-- Filter Pills -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
            <button 
              class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full font-label-meta text-[11px] whitespace-nowrap transition-all ${currentFilter === 'all' ? 'bg-on-surface text-surface shadow-xs font-bold' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
              onclick="window.comunicaStore.setCalendarFilter('all')"
            >
              <span>Todos los hitos</span>
              <span class="px-1.5 py-0.2 rounded-full bg-surface/20 text-[10px] font-label-code">${events.length}</span>
            </button>
            <button 
              class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full font-label-meta text-[11px] whitespace-nowrap transition-all ${currentFilter === 'publicacion' ? 'bg-primary text-on-primary shadow-xs font-bold' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
              onclick="window.comunicaStore.setCalendarFilter('publicacion')"
            >
              <span class="w-2 h-2 rounded-full bg-primary"></span>
              <span>Contenidos (Salida)</span>
            </button>
            <button 
              class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full font-label-meta text-[11px] whitespace-nowrap transition-all ${currentFilter === 'produccion' ? 'bg-secondary text-on-secondary shadow-xs font-bold' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
              onclick="window.comunicaStore.setCalendarFilter('produccion')"
            >
              <span class="w-2 h-2 rounded-full bg-secondary"></span>
              <span>Rodajes & Producción</span>
            </button>
            <button 
              class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full font-label-meta text-[11px] whitespace-nowrap transition-all ${currentFilter === 'agenda' ? 'bg-tertiary text-on-tertiary shadow-xs font-bold' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
              onclick="window.comunicaStore.setCalendarFilter('agenda')"
            >
              <span class="w-2 h-2 rounded-full bg-tertiary"></span>
              <span>Agenda & Citas</span>
            </button>
          </div>
        </div>

        <!-- Month Grid View -->
        ${calendarView === 'mes' ? `
          <div class="mt-4">
            <div class="p-4 sm:p-5 rounded-2xl bg-surface-container-lowest border border-surface-container-highest shadow-xs flex flex-col gap-3">
              <!-- Weekday headers -->
              <div class="grid grid-cols-7 text-center font-label-code text-[12px] text-on-surface-variant/80 font-bold mb-1">
                <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
              </div>

              <!-- Days Grid -->
              <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center" id="calendarDaysGrid">
                ${monthMatrix.map(cell => {
                  const isSelected = cell.date === selectedDate;
                  const dateEvts = filteredEvents.filter(e => e.date === cell.date);
                  const hasPub = dateEvts.some(e => e.type === 'publicacion');
                  const hasProd = dateEvts.some(e => e.type === 'produccion');
                  const hasAgenda = dateEvts.some(e => e.type === 'agenda' || e.type === 'revision');

                  return `
                    <button 
                      class="day-cell p-2 sm:p-2.5 flex flex-col items-center justify-start rounded-xl font-label-code text-[12px] transition-all cursor-pointer ${cell.currentMonth ? 'text-on-surface' : 'opacity-30 text-on-surface-variant'} ${isSelected ? 'bg-primary text-on-primary font-bold shadow-md scale-105' : 'hover:bg-surface-container'}"
                      onclick="window.comunicaStore.setCalendarSelectedDate('${cell.date}')"
                    >
                      <span>${cell.day}</span>
                      <div class="flex gap-1 mt-1.5 min-h-[5px]">
                        ${hasPub ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-primary'}"></span>` : ''}
                        ${hasProd ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-secondary-fixed' : 'bg-secondary'}"></span>` : ''}
                        ${hasAgenda ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-tertiary-fixed' : 'bg-tertiary'}"></span>` : ''}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- Legend Bar -->
              <div class="flex items-center justify-between pt-3 border-t border-surface-container text-on-surface-variant/80 font-label-meta text-[11px]">
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-primary"></span>
                  <span>Publicación</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-secondary"></span>

        ` : ''}

/**
 * ComunicaLab - Tasks View (Tareas y Gestión Operativa)
 */

const TasksView = {
  render(state) {
    const taskFilter = state.taskFilter || 'all';
    const activeBrand = window.comunicaStore.getActiveBrand();
    const tasks = state.tareas || [];
    const currentUserName = window.comunicaStore.getUserName();

    const filteredTasks = tasks.filter(t => {
      if (taskFilter === 'all') return true;
      if (taskFilter === 'pendiente') return t.status === 'pendiente';
      if (taskFilter === 'en-curso') return t.status === 'en-curso';
      if (taskFilter === 'completada') return t.status === 'completada';
      return true;
    });

    const pendingCount = tasks.filter(t => t.status === 'pendiente').length;
    const inProgressCount = tasks.filter(t => t.status === 'en-curso').length;
    const completedCount = tasks.filter(t => t.status === 'completada').length;

    return `
      <div class="flex flex-col w-full max-w-5xl mx-auto pb-28 pt-2 px-4 sm:px-6">
        
        <!-- Header -->
        <div class="pt-2 pb-4 flex flex-col sm:flex-row sm:items-end justify-between gap-3 border-b border-surface-container">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <h1 class="font-headline-md sm:font-headline-lg font-normal text-on-surface">Gestión de Tareas</h1>
              <span class="font-label-code text-[12px] text-primary bg-primary-fixed/50 px-2.5 py-0.5 rounded-full font-bold">
                ${tasks.length}
              </span>
            </div>
            <p class="font-body-sm text-on-surface-variant">Producción, rodaje, edición, copywriting y programación.</p>
          </div>
          <button 
            class="flex items-center gap-1.5 px-4 py-2 bg-primary text-on-primary rounded-xl font-title-sm text-[13px] font-semibold shadow-xs hover:bg-primary-container active:scale-95 transition-all self-start sm:self-auto"
            onclick="window.comunicaApp.openModal('modal-crear-tarea')"
          >
            <span class="material-symbols-outlined text-[18px]">add</span>
            <span>Nueva tarea</span>
          </button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-3">
          <button 
            class="px-4 py-1.5 rounded-full font-label-meta text-[11px] font-semibold transition-all ${taskFilter === 'all' ? 'bg-on-surface text-surface shadow-xs' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
            onclick="window.comunicaStore.setTaskFilter('all')"
          >
            Todas (${tasks.length})
          </button>
          <button 
            class="px-4 py-1.5 rounded-full font-label-meta text-[11px] font-semibold transition-all ${taskFilter === 'pendiente' ? 'bg-primary text-on-primary shadow-xs' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
            onclick="window.comunicaStore.setTaskFilter('pendiente')"
          >
            Pendientes (${pendingCount})
          </button>
          <button 
            class="px-4 py-1.5 rounded-full font-label-meta text-[11px] font-semibold transition-all ${taskFilter === 'en-curso' ? 'bg-secondary text-on-secondary shadow-xs' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
            onclick="window.comunicaStore.setTaskFilter('en-curso')"
          >
            En curso (${inProgressCount})
          </button>
          <button 
            class="px-4 py-1.5 rounded-full font-label-meta text-[11px] font-semibold transition-all ${taskFilter === 'completada' ? 'bg-tertiary text-on-tertiary shadow-xs' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'}"
            onclick="window.comunicaStore.setTaskFilter('completada')"
          >
            Completadas (${completedCount})
          </button>
        </div>

        <!-- Tasks List -->
        <div class="space-y-3 mt-1">
          ${filteredTasks.length === 0 ? `
            <div class="p-8 text-center bg-surface-container-lowest rounded-2xl border border-surface-container-highest">
              <span class="material-symbols-outlined text-[32px] text-on-surface-variant mb-2">task_alt</span>
              <p class="font-title-sm text-on-surface mb-1">No hay tareas en este estado.</p>
              <button class="mt-2 px-4 py-2 bg-primary text-on-primary rounded-xl font-title-sm text-[13px]" onclick="window.comunicaApp.openModal('modal-crear-tarea')">
                + Crear nueva tarea
              </button>
            </div>
          ` : filteredTasks.map(task => {
            const isDone = task.status === 'completada';
            const inProgress = task.status === 'en-curso';
            const brand = state.marcas.find(m => m.id === task.brandId);
            const content = state.contenidos.find(c => c.id === task.contentId);
            const assigneeName = task.assignee || currentUserName || 'Equipo';

            return `
              <div class="bg-surface-container-lowest p-4 rounded-xl border border-surface-container-highest shadow-xs hover:border-primary/40 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-start gap-3 flex-1 min-w-0">
                  <input

                    onchange="window.comunicaStore.toggleTaskStatus('${task.id}')"
                    title="${isDone ? 'Marcar como pendiente' : 'Marcar como completada'}"
                  />
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                      <span class="font-label-code text-[10px] uppercase px-2 py-0.5 rounded font-bold ${isDone ? 'bg-tertiary/10 text-tertiary' : (inProgress ? 'bg-secondary/10 text-secondary' : 'bg-primary/10 text-primary')}">
                        ${isDone ? 'Completada' : (inProgress ? 'En curso' : 'Pendiente')}
                      </span>
                      ${brand ? `
                        <span class="font-label-code text-[10px] text-on-surface-variant bg-surface-container px-2 py-0.5 rounded">
                          ${escapeHtml(brand.name)}
                        </span>
                      ` : ''}
                      ${content ? `
                        <span class="font-label-code text-[10px] text-primary hover:underline cursor-pointer" onclick="window.comunicaApp.navigate('contenido-detalle', { contentId: '${content.id}' })">
                          Pieza: ${escapeHtml(content.title)}
                        </span>
                      ` : ''}
                    </div>

                    <h3 class="font-title-sm text-[14px] ${isDone ? 'line-through text-on-surface-variant opacity-60' : 'text-on-surface font-semibold'} leading-snug">
                      ${escapeHtml(task.title)}
                    </h3>

                    ${task.notes ? `
                      <p class="font-body-sm text-[12px] text-on-surface-variant mt-0.5">${escapeHtml(task.notes)}</p>
                    ` : ''}
                  </div>
                </div>

                <div class="flex items-center gap-3 self-end sm:self-auto shrink-0 pt-2 sm:pt-0 border-t sm:border-0 border-surface-container w-full sm:w-auto justify-between sm:justify-start">
                  <div class="text-right font-label-code text-[11px] text-on-surface-variant">
                    <span class="block text-on-surface font-medium">${escapeHtml(assigneeName)}</span>
                    <span>${escapeHtml(task.date)} · ${escapeHtml(task.time || '10:00')}</span>
                  </div>

                  <div class="flex items-center gap-1">
                    <button 
                      class="p-1.5 text-on-surface-variant hover:text-primary transition-colors"
                      onclick="window.comunicaApp.openEditTaskModal('${task.id}')"
                      title="Editar tarea"
                    >
                      <span class="material-symbols-outlined text-[18px]">edit</span>
                    </button>
                    <button 
                      class="p-1.5 text-on-surface-variant hover:text-error transition-colors"
                      onclick="window.comunicaApp.confirmDeleteTask('${task.id}')"
                      title="Eliminar tarea"
                    >
                      <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

      </div>
    `;
  }
};

window.TasksView = TasksView;

/**
 * ComunicaLab - Main Application Orchestrator & Router
 */

class ComunicaApp {
  constructor() {
    this.currentAdaptContentId = null;
    this.currentAdaptTab = 'instagram';
  }

  init() {
    // Subscribe to store updates
    window.comunicaStore.subscribe((state) => {
      this.renderApp(state);
    });

    // Initial render
    this.renderApp(window.comunicaStore.getState());

    // Global click listener to close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      const brandMenu = document.getElementById('brand-dropdown-menu');
      const brandBtn = document.getElementById('brand-switcher-trigger');
      if (brandMenu && !brandMenu.contains(e.target) && brandBtn && !brandBtn.contains(e.target)) {
        brandMenu.classList.add('hidden');
        brandMenu.classList.remove('flex');
      }

      const notifMenu = document.getElementById('notifications-dropdown-menu');
      if (notifMenu && !notifMenu.contains(e.target) && !e.target.closest('[aria-label="Recordatorios y Alertas"]')) {
        notifMenu.classList.add('hidden');
        notifMenu.classList.remove('flex');
      }

      const quickMenu = document.getElementById('quick-create-menu');
      const quickBtn = document.getElementById('quick-create-btn');
      if (quickMenu && !quickMenu.contains(e.target) && quickBtn && !quickBtn.contains(e.target)) {
        quickMenu.classList.add('hidden');
        quickMenu.classList.remove('flex');
        const icon = document.getElementById('plus-icon');
        if (icon) icon.style.transform = 'rotate(0deg)';
      }
    });

    // Keyboard escape to close modals
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const openModals = document.querySelectorAll('[id^="modal-"]:not(.hidden)');
        openModals.forEach(m => m.classList.add('hidden'));
      }
    });
  }

  renderApp(state) {
    const headerContainer = document.getElementById('app-header');
    const viewContainer = document.getElementById('app-view-container');
    const navContainer = document.getElementById('app-bottom-nav');
    const modalsContainer = document.getElementById('app-modals');

    if (headerContainer) {
      headerContainer.innerHTML = window.HeaderComponent.render(state);
    }

    // Only render modals if not already rendered or if no modal is currently active
    const hasActiveModal = document.querySelector('[id^="modal-"]:not(.hidden)');
    if (modalsContainer && (!modalsContainer.hasChildNodes() || !hasActiveModal)) {
      modalsContainer.innerHTML = window.ModalsComponent.render(state);
    }

    if (navContainer) {
      navContainer.innerHTML = window.NavComponent.render(state);
    }

    if (viewContainer) {
      const route = state.currentRoute;
      window.scrollTo(0, 0);

      switch (route) {
        case 'marcas':
        case 'marca-detalle':
          viewContainer.innerHTML = window.BrandsView.render(state);
          break;
        case 'proyecto-detalle':
          viewContainer.innerHTML = window.ProjectView.render(state);
          break;
        case 'contenido-detalle':
          viewContainer.innerHTML = window.ContentSheetView.render(state);
          break;
        case 'calendario':
          viewContainer.innerHTML = window.CalendarView.render(state);
          break;
        case 'tareas':
          viewContainer.innerHTML = window.TasksView.render(state);
          break;
        case 'ideas':
          viewContainer.innerHTML = window.IdeasView.render(state);
          break;
        case 'asistente':
          viewContainer.innerHTML = window.AssistantView.render(state);
          // Scroll to bottom of chat
          const chat = document.getElementById('assistant-chat-feed');
          if (chat) chat.scrollTop = chat.scrollHeight;
          break;
        case 'configuracion':
          viewContainer.innerHTML = window.SettingsView.render(state);
          break;
        case 'inicio':
        default:
          viewContainer.innerHTML = window.DashboardView.render(state);
          break;
      }
    }
  }

  navigate(route, params = {}) {
    window.comunicaStore.setRoute(route, params);
  }

  switchBrand(brandId) {
    window.comunicaStore.setActiveBrand(brandId);
    const brandMenu = document.getElementById('brand-dropdown-menu');
    if (brandMenu) {
      brandMenu.classList.add('hidden');
      brandMenu.classList.remove('flex');
    }
    const b = window.comunicaStore.getActiveBrand();
    if (b) window.Toast.show(`Marca activa: ${b.name}`);
  }

  selectBrandAndOpen(brandId) {
    window.comunicaStore.setActiveBrand(brandId);
    window.comunicaStore.setRoute('marca-detalle');
  }

  selectProjectAndOpen(projectId) {
    window.comunicaStore.setActiveProject(projectId);
    window.comunicaStore.setRoute('proyecto-detalle');
  }

  selectContentAndOpen(contentId) {
    window.comunicaStore.setActiveContent(contentId);
    window.comunicaStore.setRoute('contenido-detalle');
  }

  // --- Dropdown Toggles ---
  toggleBrandMenu(e) {
    e.stopPropagation();
    const menu = document.getElementById('brand-dropdown-menu');
    if (menu) {
      const isHidden = menu.classList.contains('hidden');
      if (isHidden) {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
      } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
      }
    }
  }

  toggleNotifications(e) {
    e.stopPropagation();
    const menu = document.getElementById('notifications-dropdown-menu');
    if (menu) {
      const isHidden = menu.classList.contains('hidden');
      if (isHidden) {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
      } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
      }
    }
  }

  // --- Modal Helpers ---
  openModal(modalId) {
    const modalsContainer = document.getElementById('app-modals');
    if (modalsContainer) {
      modalsContainer.innerHTML = window.ModalsComponent.render(window.comunicaStore.getState());
    }
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.remove('hidden');
    }
  }

  closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.add('hidden');
    }
  }

  // --- Creation Form Handlers ---
  handleCreateBrand(e) {
    e.preventDefault();
    const nameInput = document.getElementById('brand-input-name');
    const name = nameInput ? nameInput.value.trim() : '';
    if (!name) {
      window.Toast.show('Ingresa un nombre para la marca', 'error');
      return;
    }

    const category = document.getElementById('brand-input-category').value.trim();
    const color = document.getElementById('brand-input-color').value;
    const tagline = document.getElementById('brand-input-tagline').value.trim();
    const tone = document.getElementById('brand-input-tone').value.trim();

    const newBrand = window.comunicaStore.createBrand({
      name,
      category,
      color,
      tagline,
      tone
    });

    this.closeModal('modal-crear-marca');
    e.target.reset();
    window.Toast.show(`Marca ${newBrand.name} creada correctamente`, 'success');
  }

  handleCreateProject(e) {
    e.preventDefault();
    const nameInput = document.getElementById('project-input-name');
    const name = nameInput ? nameInput.value.trim() : '';
    if (!name) {
      window.Toast.show('Ingresa un nombre para el proyecto', 'error');
      return;
    }

    const brandId = document.getElementById('project-input-brand').value;
    const objective = document.getElementById('project-input-objective').value.trim();
    const startDate = document.getElementById('project-input-start').value;
    const endDate = document.getElementById('project-input-end').value;

    const newProj = window.comunicaStore.createProject({
      name,
      brandId,
      objective,
      startDate,
      endDate
    });

    this.closeModal('modal-crear-proyecto');
    e.target.reset();
    window.Toast.show(`Proyecto ${newProj.name} creado.`, 'success');
  }

  handleCreateContent(e) {
    e.preventDefault();
    const titleInput = document.getElementById('content-input-title');
    const title = titleInput ? titleInput.value.trim() : '';
    if (!title) {
      window.Toast.show('Ingresa un título para la pieza', 'error');
      return;
    }

    const format = document.getElementById('content-input-format').value;
    const platform = document.getElementById('content-input-platform').value;
    const date = document.getElementById('content-input-date').value;
    const time = document.getElementById('content-input-time').value;
    const idea = document.getElementById('content-input-idea').value.trim();

    const newContent = window.comunicaStore.createContent({
      title,
      format,
      platform,
      date,
      time,
      idea
    });

  handleAssistantSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('assistant-user-input');
    if (!input || !input.value.trim()) return;
    const text = input.value.trim();
    input.value = '';
    this.sendAssistantPrompt(text);
  }

  async sendAssistantPrompt(query) {
    if (!window.AssistantView.chatHistory) {
      window.AssistantView.chatHistory = [];
    }

    // Push user message
    window.AssistantView.chatHistory.push({ role: 'user', text: query });
    // Push temporary loading indicator
    window.AssistantView.chatHistory.push({ role: 'assistant', text: '', loading: true });
    this.renderApp(window.comunicaStore.getState());

    const activeBrand = window.comunicaStore.getActiveBrand();
    const activeProject = window.comunicaStore.getActiveProject();
    const activeContent = window.comunicaStore.getActiveContent();
    const contents = activeProject ? window.comunicaStore.getProjectContents(activeProject.id) : [];
    const tasks = activeProject ? window.comunicaStore.getProjectTasks(activeProject.id) : [];

    const reply = await window.ComunicaAI.askAssistantAsync(query, {
      brand: activeBrand,
      project: activeProject,
      content: activeContent,
      contents,
      tasks
    });

    // Replace loading indicator with real reply
    const history = window.AssistantView.chatHistory;
    const lastIdx = history.length - 1;
    if (lastIdx >= 0 && history[lastIdx].loading) {
      history[lastIdx] = { role: 'assistant', text: reply };
    } else {
      history.push({ role: 'assistant', text: reply });
    }

    this.renderApp(window.comunicaStore.getState());
  }

  clearAssistantChat() {
    window.AssistantView.chatHistory = [
      {
        role: 'assistant',
        text: getInitialAssistantGreeting()
      }
    ];
    this.renderApp(window.comunicaStore.getState());
    window.Toast.show('Chat del copiloto reiniciado.');
  }

  copyAssistantMessage(idx) {
    const history = window.AssistantView.chatHistory;
    if (history && history[idx]) {
      navigator.clipboard.writeText(history[idx].text);
      window.Toast.show('Respuesta copiada al portapapeles');

    const newName = input ? input.value.trim() : '';
    window.comunicaStore.state.settings.userName = newName;
    window.comunicaStore.saveState();
    if (newName) {
      window.Toast.show(`Perfil actualizado: ¡Hola, ${newName}!`, 'success');
    } else {
      window.Toast.show('Nombre eliminado. Saludo neutral activado.');
    }
  }

  saveAiSettings(e) {
    e.preventDefault();
    const provider = document.getElementById('settings-ai-provider').value;
    const model = document.getElementById('settings-ai-model').value.trim();
    const apiEndpoint = document.getElementById('settings-ai-endpoint').value.trim();
    const apiKey = document.getElementById('settings-ai-key').value.trim();

    window.comunicaStore.state.settings.ai = {
      provider,
      model,
      apiEndpoint,
      apiKey
    };
    window.comunicaStore.saveState();
    window.Toast.show('Configuración de IA guardada.', 'ai');
  }

  exportWorkspace() {
    const json = window.comunicaStore.exportJson();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `comunicalab_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    window.Toast.show('Copia de seguridad JSON descargada.', 'success');
  }

  importWorkspace(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const result = window.comunicaStore.importJson(event.target.result);
        if (result.success) {
          window.Toast.show('Espacio de trabajo restaurado con éxito.', 'success');
        } else {
          window.Toast.show(result.error || 'Error al importar archivo', 'error');
        }
      };
      reader.readAsText(file);
    }
  }

  restorePreImportBackup() {
    const res = window.comunicaStore.restorePreImportBackup();
    if (res.success) {
      window.Toast.show('Copia previa a la última importación recuperada.', 'success');
    } else {
      window.Toast.show(res.error || 'No se pudo restaurar la copia previa.', 'error');
    }
  }

  resetToDemoData() {
    if (confirm('¿Restaurar los datos de demostración originales de ComunicaLab? Se sobreescribirán las modificaciones locales no guardadas.')) {
      window.comunicaStore.resetToDemo();
      window.Toast.show('Datos de demostración restaurados.');
    }
  }
}

// Global App Instance
window.comunicaApp = new ComunicaApp();

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => window.comunicaApp.init());
} else {
  window.comunicaApp.init();
}
</script>
</body>
</html>
